<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healtheon</title>
<meta name="robots" content="noindex">
<script>
  // Any unknown address on this site goes back to the home page.
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    // Project sites live under /<repo-name>/, user sites at the root.
    var base = location.hostname.endsWith('github.io') && parts.length ? '/' + parts[0] + '/' : '/';
    location.replace(base);
  })();
</script>

</head>

</body>
